[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartograph"
version = "0.1.0"
description = "A cyclic LangGraph research agent with a token auditor, served over MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.29",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.14",
    "pydantic>=2.9",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "openai-agents>=0.22",
]

[project.scripts]
cartograph-mcp = "cartograph_mcp.server:main"

[tool.setuptools]
# Listed, not discovered. ./mcp (the tools-only server script) must never be
# installed as a package: it would shadow the ``mcp`` SDK.
packages = [
    "agent",
    "agent.auditor",
    "agent.nodes",
    "agent.sdk_runtime",
    "agent.tools",
    "cartograph_mcp",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# ./mcp holds the MCP server script; the importable ``mcp`` is the SDK.
known-third-party = ["mcp", "agents"]
