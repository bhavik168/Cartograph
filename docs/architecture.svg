<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="Cartographer graph architecture: supervisor routes to a fan-out of researchers or straight to the synthesizer; synthesizer feeds the critic; a failing critique loops back through revise to the supervisor; passing goes to the finalizer.">
  <title>Cartographer — cyclic LangGraph architecture</title>

  <defs>
    <style>
      .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .m   { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .fg  { fill: #e6edf3; }
      .mu  { fill: #8695a8; }
      .dim { fill: #5d6b7d; }
      .box { fill: #141d2b; stroke-width: 1.6; }
    </style>
    <marker id="aSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5d75"/>
    </marker>
    <marker id="aCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="aRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="600" rx="16" fill="#0d1420" stroke="#1c2838"/>

  <!-- header -->
  <text class="t fg" x="36" y="44" font-size="18" font-weight="700">Cartographer</text>
  <text class="m mu" x="36" y="66" font-size="11">cyclic LangGraph state machine · agent/graph.py</text>

  <!-- legend -->
  <path d="M790,40 H818" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="t mu" x="826" y="44" font-size="10.5">conditional edge</text>
  <path d="M930,40 H958" stroke="#fb7185" stroke-width="2"/>
  <text class="t mu" x="966" y="44" font-size="10.5">revision cycle</text>
  <path d="M1058,40 H1086" stroke="#fbbf24" stroke-width="2"/>
  <text class="t mu" x="1094" y="44" font-size="10.5">untrusted data</text>

  <!-- state / reducers annotation -->
  <rect x="36" y="96" width="212" height="120" rx="12" fill="#101826" stroke="#233145"/>
  <text class="t fg" x="52" y="120" font-size="12.5" font-weight="600">AnalystState</text>
  <text class="m mu" x="52" y="144" font-size="9.5">findings  → operator.add</text>
  <text class="m mu" x="52" y="160" font-size="9.5">trace     → operator.add</text>
  <text class="m dim" x="52" y="176" font-size="9.5">draft · critique · scratchpad</text>
  <text class="m dim" x="52" y="192" font-size="9.5">revision_count · flags</text>
  <text class="t dim" x="52" y="208" font-size="9">reducers merge parallel writes</text>

  <!-- tools + quarantine gate -->
  <rect x="265" y="104" width="300" height="38" rx="10" fill="#1a1710" stroke="#4a3c17"/>
  <text class="m" x="415" y="128" font-size="10.5" text-anchor="middle" fill="#d9b45f">corpus_search · calculator · fetch_url (off)</text>
  <path d="M415,142 V162" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#aAmber)"/>

  <rect x="305" y="166" width="220" height="38" rx="10" fill="#1a1710" stroke="#8a6b1f"/>
  <text class="m" x="415" y="190" font-size="11.5" text-anchor="middle" fill="#fbbf24">guards.quarantine()</text>
  <path d="M415,204 V216" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#aAmber)"/>
  <text class="t dim" x="545" y="182" font-size="9.5">untrusted → data,</text>
  <text class="t dim" x="545" y="196" font-size="9.5">never instructions</text>

  <!-- START -->
  <rect x="44" y="327" width="60" height="32" rx="16" fill="#141d2b" stroke="#3d4d61"/>
  <text class="m mu" x="74" y="347" font-size="10.5" text-anchor="middle">START</text>
  <path d="M104,343 H137" stroke="#4a5d75" stroke-width="1.8" marker-end="url(#aSlate)"/>

  <!-- supervisor -->
  <rect class="box" x="140" y="300" width="140" height="86" rx="12" stroke="#38bdf8"/>
  <text class="t fg" x="156" y="328" font-size="14.5" font-weight="600">supervisor</text>
  <text class="m mu" x="156" y="347" font-size="9.5">→ RoutingDecision</text>
  <rect x="155" y="356" width="86" height="19" rx="6" fill="#38bdf8" fill-opacity="0.14"/>
  <text class="m" x="198" y="369.5" font-size="9" text-anchor="middle" fill="#7dd3fc">haiku · cheap</text>

  <path d="M280,343 H307" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aCyan)"/>

  <!-- fan-out container -->
  <rect x="310" y="220" width="210" height="246" rx="14" fill="#101826" stroke="#2d3b4f" stroke-dasharray="6 5"/>
  <text class="m dim" x="415" y="458" font-size="10" text-anchor="middle">asyncio.gather · fan-out</text>

  <rect class="box" x="324" y="236" width="182" height="54" rx="10" stroke="#fbbf24"/>
  <text class="t fg" x="340" y="258" font-size="13" font-weight="600">researcher</text>
  <text class="m mu" x="340" y="276" font-size="9.5">sq1 · bind_tools · cheap</text>

  <rect class="box" x="324" y="314" width="182" height="54" rx="10" stroke="#fbbf24"/>
  <text class="t fg" x="340" y="336" font-size="13" font-weight="600">researcher</text>
  <text class="m mu" x="340" y="354" font-size="9.5">sq2 · bind_tools · cheap</text>

  <rect class="box" x="324" y="392" width="182" height="54" rx="10" stroke="#fbbf24"/>
  <text class="t fg" x="340" y="414" font-size="13" font-weight="600">researcher</text>
  <text class="m mu" x="340" y="432" font-size="9.5">sq3 · bind_tools · cheap</text>

  <path d="M520,343 H557" stroke="#4a5d75" stroke-width="1.8" marker-end="url(#aSlate)"/>

  <!-- synthesizer -->
  <rect class="box" x="560" y="300" width="140" height="86" rx="12" stroke="#a78bfa"/>
  <text class="t fg" x="576" y="328" font-size="14.5" font-weight="600">synthesizer</text>
  <text class="m mu" x="576" y="347" font-size="9.5">→ Brief</text>
  <rect x="575" y="356" width="97" height="19" rx="6" fill="#a78bfa" fill-opacity="0.14"/>
  <text class="m" x="623.5" y="369.5" font-size="9" text-anchor="middle" fill="#c4b5fd">sonnet · strong</text>

  <path d="M700,343 H757" stroke="#4a5d75" stroke-width="1.8" marker-end="url(#aSlate)"/>

  <!-- critic -->
  <rect class="box" x="760" y="300" width="140" height="86" rx="12" stroke="#fb7185"/>
  <text class="t fg" x="776" y="328" font-size="14.5" font-weight="600">critic</text>
  <text class="m mu" x="776" y="347" font-size="9.5">→ Critique</text>
  <rect x="775" y="356" width="97" height="19" rx="6" fill="#fb7185" fill-opacity="0.14"/>
  <text class="m" x="823.5" y="369.5" font-size="9" text-anchor="middle" fill="#fda4af">sonnet · strong</text>

  <path d="M900,343 H997" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aCyan)"/>
  <rect x="908" y="323" width="84" height="38" rx="6" fill="#0d1420"/>
  <text class="t mu" x="950" y="338" font-size="10" text-anchor="middle">passed=True</text>
  <text class="t dim" x="950" y="352" font-size="10" text-anchor="middle">or bound hit</text>

  <!-- finalizer -->
  <rect class="box" x="1000" y="300" width="140" height="86" rx="12" stroke="#34d399"/>
  <text class="t fg" x="1016" y="328" font-size="14.5" font-weight="600">finalizer</text>
  <text class="m mu" x="1016" y="347" font-size="9.5">validate · write</text>
  <rect x="1015" y="356" width="79" height="19" rx="6" fill="#34d399" fill-opacity="0.14"/>
  <text class="m" x="1054.5" y="369.5" font-size="9" text-anchor="middle" fill="#6ee7b7">no LLM call</text>

  <path d="M1140,343 H1177" stroke="#34d399" stroke-width="1.8" marker-end="url(#aGreen)"/>
  <rect x="1180" y="327" width="56" height="32" rx="16" fill="#141d2b" stroke="#34d399"/>
  <text class="m" x="1208" y="347" font-size="10.5" text-anchor="middle" fill="#6ee7b7">END</text>

  <!-- conditional skip: supervisor -> synthesizer, no new research -->
  <path d="M228,386 C240,540 630,540 630,391" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aCyan)"/>
  <rect x="310" y="494" width="240" height="22" rx="6" fill="#0d1420"/>
  <text class="t mu" x="430" y="509" font-size="10.5" text-anchor="middle">directives need no new evidence</text>

  <!-- the cycle: critic -> revise -> supervisor -->
  <path d="M830,386 V540 H585" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#aRose)"/>
  <rect x="460" y="522" width="120" height="36" rx="10" fill="#1c1218" stroke="#fb7185"/>
  <text class="t" x="520" y="539" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fda4af">revise</text>
  <text class="m dim" x="520" y="552" font-size="8.5" text-anchor="middle">revision_count += 1</text>
  <path d="M460,540 H198 V391" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#aRose)"/>
  <rect x="620" y="510" width="196" height="22" rx="6" fill="#0d1420"/>
  <text class="t mu" x="718" y="525" font-size="10.5" text-anchor="middle">passed=False · under bound</text>

  <text class="m dim" x="640" y="580" font-size="10" text-anchor="middle">bounded by MAX_REVISIONS and the --max-usd ceiling, both checked in revise</text>
</svg>
